[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "diffusion-lora-runtime"
version = "0.2.0"
description = "Standalone diffusion backend runtime for model + LoRA + prompt-resolution image generation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Diffusion LoRA Runtime contributors" }]
dependencies = [
  "accelerate>=0.17.0",
  "diffusers>=0.35.0,<0.36.0",
  "peft>=0.13.0",
  "pillow>=11.0.0",
  "safetensors>=0.4.5",
  "transformers>=4.45.0,<4.57.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/diffusion_lora_runtime"]

[tool.ruff]
line-length = 120

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
